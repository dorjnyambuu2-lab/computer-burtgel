; Ажиллах орчны PHP тохиргоо (Docker)
expose_php = Off
memory_limit = 256M
upload_max_filesize = 10M
post_max_size = 12M
max_execution_time = 60

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; Image дотор код өөрчлөгддөггүй тул файлыг дахин шалгахгүй
opcache.validate_timestamps = 0
