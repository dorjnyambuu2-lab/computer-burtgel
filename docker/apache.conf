<VirtualHost *:${PORT}>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        # public/.htaccess (чиглүүлэлт, урьдчилан шахсан .gz файл, кэш) ажиллахын тулд
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
